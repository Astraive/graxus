[workspace]
resolver = "2"
members = [
    "crates/graxus-core",
    "crates/graxus-docgraph",
    "crates/graxus-codemap",
    "crates/graxus-index",
    "crates/graxus-edit",
    "cli",
    "crates/graxus-agent-api",
    "crates/graxus-embed",
    "crates/graxus-llm",
    "crates/graxus-server",
    "crates/graxus-viz",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AI-native codebase knowledge engine and semantic code intelligence."
repository = "https://github.com/Astraive/graxus"
homepage = "https://github.com/Astraive/graxus"
publish = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
walkdir = "2"
ignore = "0.4"
sha2 = "0.10"
pulldown-cmark = "0.12"
regex = "1"
serde_yaml = "0.9"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.23"
tree-sitter-python = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1"
tree-sitter-swift = "0.7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
colored = "3"
globset = "0.4"
notify = "6"
criterion = { version = "0.5", features = ["html_reports"] }
ctrlc = "3"
tempfile = "3"
semver = "1"
subtle = "2"
indicatif = "0.18.6"
clap_complete = "4"
ripex = { version = "0.3.0", default-features = false, features = ["serde", "lang-all"] }
