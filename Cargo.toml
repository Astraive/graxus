[workspace]
resolver = "2"
members = [
    "crates/graxus-core",
    "crates/graxus-docgraph",
    "crates/graxus-codemap",
    "crates/graxus-index",
    "crates/graxus-edit",
    "crates/graxus-cli",
    "crates/graxus-agent-api",
    "crates/graxus-embed",
    "crates/graxus-llm",
    "crates/graxus-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
walkdir = "2"
ignore = "0.4"
sha2 = "0.10"
pulldown-cmark = "0.12"
regex = "1"
serde_yaml = "0.9"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
colored = "3"
tabled = "0.19"
globset = "0.4"
notify = "6"

