[package]
name = "graxus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "graxus"
path = "src/main.rs"

[dependencies]
graxus-core = { version = "0.1.0", path = "../crates/graxus-core" }
graxus-docgraph = { version = "0.1.0", path = "../crates/graxus-docgraph" }
graxus-codemap = { version = "0.1.0", path = "../crates/graxus-codemap" }
graxus-index = { version = "0.1.0", path = "../crates/graxus-index" }
graxus-edit = { version = "0.1.0", path = "../crates/graxus-edit" }
graxus-agent-api = { version = "0.1.0", path = "../crates/graxus-agent-api" }
graxus-embed = { version = "0.1.0", path = "../crates/graxus-embed" }
graxus-llm = { version = "0.1.0", path = "../crates/graxus-llm" }
graxus-server = { version = "0.1.0", path = "../crates/graxus-server" }
graxus-viz = { version = "0.1.0", path = "../crates/graxus-viz" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
colored.workspace = true
globset.workspace = true
chrono.workspace = true
regex.workspace = true
notify.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sha2 = { workspace = true }
ctrlc = { workspace = true }
indicatif = { workspace = true }
clap_complete = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
