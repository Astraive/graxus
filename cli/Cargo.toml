[package]
name = "graxus-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "graxus"
path = "src/main.rs"

[dependencies]
graxus-core = { path = "../crates/graxus-core" }
graxus-docgraph = { path = "../crates/graxus-docgraph" }
graxus-codemap = { path = "../crates/graxus-codemap" }
graxus-index = { path = "../crates/graxus-index" }
graxus-edit = { path = "../crates/graxus-edit" }
graxus-agent-api = { path = "../crates/graxus-agent-api" }
graxus-embed = { path = "../crates/graxus-embed" }
graxus-llm = { path = "../crates/graxus-llm" }
graxus-server = { path = "../crates/graxus-server" }
graxus-viz = { path = "../crates/graxus-viz" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
colored.workspace = true
globset.workspace = true
tabled.workspace = true
chrono.workspace = true
regex.workspace = true
notify.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sha2 = { workspace = true }
ctrlc = { workspace = true }
indicatif = { workspace = true }
clap_complete = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
