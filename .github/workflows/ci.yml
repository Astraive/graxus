name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Ripex dependency
        shell: pwsh
        run: |
          $ripexPath = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) "ripex"
          git clone --depth 1 https://github.com/Astraive/ripex.git $ripexPath
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check --all-features

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Ripex dependency
        shell: pwsh
        run: |
          $ripexPath = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) "ripex"
          git clone --depth 1 https://github.com/Astraive/ripex.git $ripexPath
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
