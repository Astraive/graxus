[package]
name = "graxus-server"
version.workspace = true
edition = "2021"
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
graxus-core = { version = "0.1.0", path = "../graxus-core" }
graxus-docgraph = { version = "0.1.0", path = "../graxus-docgraph" }
graxus-codemap = { version = "0.1.0", path = "../graxus-codemap" }
graxus-index = { version = "0.1.0", path = "../graxus-index" }
graxus-agent-api = { version = "0.1.0", path = "../graxus-agent-api" }
serde.workspace = true
serde_json.workspace = true
serde_repr = "0.1"
anyhow.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
subtle.workspace = true

[dev-dependencies]
tempfile = "3"
