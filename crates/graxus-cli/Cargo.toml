[package]
name = "graxus-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "graxus"
path = "src/main.rs"

[dependencies]
graxus-core = { path = "../graxus-core" }
graxus-docgraph = { path = "../graxus-docgraph" }
graxus-codemap = { path = "../graxus-codemap" }
graxus-index = { path = "../graxus-index" }
graxus-edit = { path = "../graxus-edit" }
graxus-agent-api = { path = "../graxus-agent-api" }
graxus-embed = { path = "../graxus-embed" }
graxus-llm = { path = "../graxus-llm" }
graxus-server = { path = "../graxus-server" }
graxus-viz = { path = "../graxus-viz" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
colored.workspace = true
tabled.workspace = true
chrono.workspace = true
regex.workspace = true
notify.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
